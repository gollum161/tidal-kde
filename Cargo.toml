[package]
name = "tidal-kde"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Unofficial KDE/Kirigami TIDAL client with synced lyrics, a play queue and MPRIS"
license = "GPL-3.0-or-later"
repository = "https://github.com/gollum161/tidal-kde"

[dependencies]
cxx = "1.0.95"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_gui", "qt_qml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
fastrand = "2"
dirs = "5"

[build-dependencies]
cxx-qt-build = { version = "0.7", features = ["link_qt_object_files"] }

[profile.release]
lto = "thin"
strip = true
